<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Isi Data Siswa &middot; Check-in</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="stylesheet" href="../assets/css/portal.css">
  <style>
    :root{--primary:#0f766e;--primary-dark:#115e59;--accent:#f59e0b;--bg:#f0fdfa;--card:#fff;--text:#173b3a;--muted:#64807e;--line:#d8ebe8;--danger:#dc2626;--radius:18px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#ecfeff,var(--bg));color:var(--text);min-height:100vh;padding-bottom:40px}
    .back-bar{background:var(--primary-dark);color:#fff;padding:11px 16px}
    .back-bar a{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600}
    .max-w{max-width:400px;margin:auto;padding:16px}
    .card{background:var(--card);border:1px solid rgba(216,235,232,.8);border-radius:var(--radius);padding:22px;box-shadow:0 8px 24px rgba(15,118,110,.07);margin-bottom:16px}
    h2{font-size:1.1rem;color:var(--primary-dark);margin-bottom:6px}
    .sub{font-size:.82rem;color:var(--muted);margin-bottom:16px}
    label{display:grid;gap:6px;font-size:.77rem;font-weight:700;color:var(--muted);margin-bottom:14px}
    input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;color:var(--text);background:#fbfffe;min-height:45px}
    input[type=text]:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px rgba(15,118,110,.12)}
    input[type=text].invalid{border-color:#fca5a5;background:#fff5f5}
    .btn{border:0;border-radius:11px;padding:12px 16px;min-height:42px;font:700 .82rem inherit;cursor:pointer;transition:.18s;width:100%;background:var(--primary);color:#fff}
    .btn:hover{background:var(--primary-dark)}
    .btn.soft{background:#e6f6f3;color:var(--primary-dark)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .notice{padding:12px 14px;border-radius:12px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:.82rem}
    .hint{font-size:.74rem;color:var(--muted);margin-top:-8px;margin-bottom:12px}
    .confirm{background:#f0fdfa;border:1px solid #c9eeea;border-radius:12px;padding:14px;margin-top:4px;margin-bottom:14px;display:none}
    .confirm .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:.85rem;border-bottom:1px dashed var(--line)}
    .confirm .row:last-child{border-bottom:0}
    .confirm .lbl{color:var(--muted)}
    .confirm .val{font-weight:700;color:var(--primary-dark);text-align:right}
  </style>
</head>
<body>

<header class="back-bar"><a href="./index.html"><span>&#8592;</span> Kembali</a></header>

<div class="max-w">
  <div class="card">
    <h2>&#128100; Isi Data Siswa</h2>
    <p class="sub">Tulis namamu dan kelasmu, lalu lanjut ambil selfie.</p>

    <form id="formSiswa" novalidate>
      <label>&#128100; Nama lengkap
        <input type="text" id="namaInput" placeholder="Contoh: Eky Sadewa" autocomplete="off" maxlength="80">
      </label>

      <label>&#127891; Kelas
        <input type="text" id="kelasInput" placeholder="Contoh: XI TKJ 2" autocomplete="off" maxlength="40">
      </label>
      <p class="hint">Tulis kelas lengkap, mis. <b>X TKJ 1</b>, <b>XI AKL 2</b>, <b>XII RPL 1</b>.</p>

      <div class="confirm" id="confirmBox">
        <div class="row"><span class="lbl">Nama</span><span class="val" id="cNama">-</span></div>
        <div class="row"><span class="lbl">Kelas</span><span class="val" id="cKelas">-</span></div>
      </div>

      <div id="errBox" class="notice" style="display:none;margin-bottom:12px;"></div>

      <button type="submit" class="btn" id="btnLanjut">&#128247; Lanjut Ambil Selfie</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/js/supabase-config.js?v=11"></script>
<script src="../assets/js/supabase-client.js?v=11"></script>
<script>
'use strict';
(function () {
  function $(s) { return document.querySelector(s); }

  var namaInput, kelasInput, errBox, confirmBox, btnLanjut, form;

  function escapeHtml(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Rapikan spasi berlebih & kapitalisasi awal kata untuk nama
  function cleanNama(v) {
    return String(v || '').replace(/\s+/g, ' ').trim();
  }
  function cleanKelas(v) {
    return String(v || '').replace(/\s+/g, ' ').trim().toUpperCase();
  }

  function validate(showError) {
    var nama = cleanNama(namaInput.value);
    var kelas = cleanKelas(kelasInput.value);
    var msg = '';

    if (nama.length < 3) msg = 'Nama minimal 3 karakter.';
    else if (nama.length > 80) msg = 'Nama terlalu panjang (maksimal 80 karakter).';
    else if (!/^[A-Za-z\u00C0-\u024F' .\-]+$/.test(nama)) msg = 'Nama hanya boleh huruf, spasi, titik, tanda hubung, dan apostrof.';
    else if (kelas.length < 1) msg = 'Kelas wajib diisi.';
    else if (kelas.length > 40) msg = 'Kelas terlalu panjang (maksimal 40 karakter).';

    if (msg) {
      if (showError) {
        errBox.textContent = msg;
        errBox.style.display = 'block';
      }
      return null;
    }
    errBox.style.display = 'none';
    return { nama: nama, kelas: kelas };
  }

  function refresh() {
    var data = validate(false);
    var ok = !!data;
    btnLanjut.disabled = !ok;

    if (data) {
      $('#cNama').textContent = data.nama;
      $('#cKelas').textContent = data.kelas;
      confirmBox.style.display = 'block';
    } else {
      confirmBox.style.display = 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (!window.SBPag) {
      alert('Klien backend tidak tersedia. Cek assets/js/supabase-client.js');
      return;
    }
    window.SBPag.init();

    form = $('#formSiswa');
    namaInput = $('#namaInput');
    kelasInput = $('#kelasInput');
    errBox = $('#errBox');
    confirmBox = $('#confirmBox');
    btnLanjut = $('#btnLanjut');

    // Cegah akses langsung via URL kalau sesi sedang NONAKTIF.
    // - Hanya redirect bila status BERHASIL dibaca dan memang nonaktif.
    // - Bila error jaringan, JANGAN redirect (mencegah bolak-balik/loop).
    window.SBPag.getSessionStatus().then(function (status) {
      if (status && !status.error && status.active === false) {
        window.location.replace('./index.html');
      }
    }).catch(function () { /* diamkan, biarkan halaman tetap tampil */ });

    namaInput.addEventListener('input', refresh);
    kelasInput.addEventListener('input', refresh);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var data = validate(true);
      if (!data) {
        // tandai kolom yang bermasalah
        namaInput.classList.toggle('invalid', cleanNama(namaInput.value).length < 3);
        kelasInput.classList.toggle('invalid', cleanKelas(kelasInput.value).length < 1);
        return;
      }
      // Simpan identitas sementara untuk sesi ini
      try {
        sessionStorage.setItem('sbCheckinStudent', JSON.stringify(data));
      } catch (err) { /* ignore */ }
      window.location.href = './selfie.html';
    });

    refresh();
    namaInput.focus();
  });
})();
</script>
</body>
</html>
