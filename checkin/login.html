<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Identifikasi Siswa &middot; Check-in</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="stylesheet" href="../assets/css/portal.css">
  <style>
    :root{--primary:#0f766e;--primary-dark:#115e59;--accent:#f59e0b;--bg:#f0fdfa;--card:#fff;--text:#173b3a;--muted:#64807e;--line:#d8ebe8;--danger:#dc2626;--radius:18px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#ecfeff,var(--bg));color:var(--text);min-height:100vh;padding-bottom:40px}
    .back-bar{background:var(--primary-dark);color:#fff;padding:11px 16px}
    .back-bar a{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600}
    .max-w{max-width:400px;margin:auto;padding:16px}
    .card{background:var(--card);border:1px solid rgba(216,235,232,.8);border-radius:var(--radius);padding:22px;box-shadow:0 8px 24px rgba(15,118,110,.07);margin-bottom:16px}
    h2{font-size:1.1rem;color:var(--primary-dark);margin-bottom:6px}
    .sub{font-size:.82rem;color:var(--muted);margin-bottom:16px}
    label{display:grid;gap:6px;font-size:.77rem;font-weight:700;color:var(--muted);margin-bottom:14px}
    input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;color:var(--text);background:#fbfffe;min-height:45px}
    input:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px rgba(15,118,110,.12)}
    .btn{border:0;border-radius:11px;padding:12px 16px;min-height:42px;font:700 .82rem inherit;cursor:pointer;transition:.18s;width:100%;background:var(--primary);color:#fff}
    .btn:hover{background:var(--primary-dark)}
    .notice{padding:12px 14px;border-radius:12px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:.82rem}
    .info-box{padding:12px 14px;border-radius:12px;background:#f0fdfa;border:1px solid #c9eeea;font-size:.85rem;color:var(--primary-dark);margin-top:14px}
    .privacy{padding:12px 14px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;font-size:.78rem;line-height:1.5}
  </style>
</head>
<body>

<header class="back-bar"><a href="./index.html"><span>&#8592;</span> Kembali</a></header>

<div class="max-w">
  <div class="card">
    <h2>&#128100; Identifikasi Siswa</h2>
    <p class="sub">Masukkan NIS atau pilih dari daftar siswa yang sudah terdaftar.</p>

    <form id="loginForm">
      <label>NIS / Nomer Induk Siswa
        <input type="text" id="nisInput" placeholder="Contoh: 2026001" autocomplete="off" inputmode="numeric">
      </label>
      <button type="submit" class="btn">&#10148; Lanjut ke Selfie</button>
    </form>

    <div id="resultBox" style="display:none;"></div>

    <div class="privacy">&#128274; <strong>Privasi:</strong> data siswa hanya digunakan untuk proses check-in. Identitas tidak akan ditampilkan ke publik.</div>
  </div>
</div>

<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script>
'use strict';
(function () {
  function $(s) { return document.querySelector(s); }

  document.addEventListener('DOMContentLoaded', function () {
    if (!window.SBPag) return;

    // Cegah akses langsung via URL kalau sesi sedang nonaktif (cek server)
    window.SBPag.getSessionStatus().then(function (status) {
      if (status && !status.error && !status.active) {
        window.location.href = './index.html';
      }
    });

    $('#loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var nis = $('#nisInput').value.trim();
      var resultBox = $('#resultBox');
      if (!nis) return;

      var result = await window.SBPag.findStudentByNIS(nis);
      if (result.error) {
        resultBox.innerHTML = '<div class="notice">&#9888; NIS tidak ditemukan. Silakan hubungi petugas petugas OSIS.</div>';
        resultBox.style.display = 'block';
        return;
      }

      var s = result.student;
      resultBox.innerHTML = '<div class="info-box">Siswa terkonfirmasi: <strong>' + escapeHtml(s.nama) + '</strong> (' + escapeHtml(s.kelas || '-') + ')</div>';
      resultBox.style.display = 'block';

      // Simpan identitas sementara untuk sesi ini (sessionStorage — bukan pembawa status)
      try {
        sessionStorage.setItem('sbCheckinStudent', JSON.stringify(s));
      } catch (err) { /* ignore */ }

      // Lanjut ke proses selfie (bagian selanjutnya)
      setTimeout(function () { window.location.href = './selfie.html'; }, 900);
    });
  });

  function escapeHtml(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();
</script>
</body>
</html>
