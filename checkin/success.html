<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Check-in Berhasil &middot; Siswa Berangkat Pagi</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="stylesheet" href="../assets/css/portal.css">
  <style>
    :root{--primary:#0f766e;--primary-dark:#115e59;--accent:#f59e0b;--bg:#f0fdfa;--card:#fff;--text:#173b3a;--muted:#64807e;--line:#d8ebe8;--danger:#dc2626;--radius:18px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#ecfeff,var(--bg));color:var(--text);min-height:100vh;padding-bottom:40px}
    .max-w{max-width:360px;margin:auto;padding:20px}
    .card{background:var(--card);border:1px solid rgba(216,235,232,.8);border-radius:var(--radius);padding:24px;box-shadow:0 8px 24px rgba(15,118,110,.07);margin:20px 0}
    h2{font-size:1.2rem;color:var(--primary-dark);margin-bottom:16px;text-align:center}
    .greet{font-size:1.05rem;color:var(--primary-dark);text-align:center;margin-bottom:6px}
    .meta{text-align:center;font-size:.82rem;color:var(--muted);margin-bottom:20px}
    .btn-primary{background:var(--primary);color:#fff;border:0;border-radius:12px;padding:14px 20px;font:700 .85rem inherit;cursor:pointer;width:100%;transition:.18s}
    .btn-primary:hover{background:var(--primary-dark)}
    .notice{padding:12px 14px;border-radius:12px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:.83rem;margin:12px 0}
    .small{font-size:.78rem;color:var(--muted);text-align:center;margin-top:12px}
  </style>
</head>
<body>

<div class="max-w">

  <div class="card">
    <div style="font-size:3rem;color:var(--primary);margin-bottom:12px;text-align:center;">&#10003;</div>
    <h2>Check-in Berhasil</h2>
    <div class="greet">Selamat, <strong id="studentName">Siswa</strong>!</div>
    <div class="meta" id="studentMeta">&nbsp;</div>

    <div class="notice">Absensi berhasil dicatat di server.</div>

    <div style="margin-top:20px;">
      <button class="btn-primary" id="btnNewCheckin">&#10148; Check-in Siswa Lain</button>
    </div>

    <div class="small">Waktu server: <span id="serverTimestamp">-</span></div>
  </div>

</div>

<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script>
'use strict';
(function () {
  function $(s) { return document.querySelector(s); }
  function escapeHtml(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function formatTs(ts) {
    if (!ts) return '-';
    try { return new Date(ts).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'medium' }); }
    catch (e) { return ts; }
  }

  document.addEventListener('DOMContentLoaded', async function () {
    var nameEl = $('#studentName');
    var metaEl = $('#studentMeta');
    var tsEl = $('#serverTimestamp');

    var stored = sessionStorage.getItem('lastCheckinStudent');
    var storedTs = sessionStorage.getItem('lastCheckinTimestamp');

    if (stored) {
      try {
        var s = JSON.parse(stored);
        nameEl.textContent = s.nama || 'Siswa';
        metaEl.textContent = 'Kelas: ' + (s.kelas || '-');
        tsEl.textContent = formatTs(storedTs);
      } catch (e) { /* ignore */ }
    } else {
      // Fallback: ambil check-in terawal hari ini (siswa paling pagi)
      var checkIns = await window.SBPag.getTodayCheckIns();
      if (checkIns && checkIns.length > 0) {
        var first = checkIns[0];
        var st = first.students;
        nameEl.textContent = st ? st.nama : 'Siswa';
        metaEl.textContent = 'Kelas: ' + (st ? (st.kelas || '-') : '-');
        tsEl.textContent = formatTs(first.checked_in_at);
      }
    }

    $('#btnNewCheckin').addEventListener('click', function () {
      sessionStorage.removeItem('lastCheckinStudent');
      sessionStorage.removeItem('lastCheckinTimestamp');
      window.location.href = './login.html';
    });
  });
})();
</script>

</body>
</html>
