<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Check-in Berhasil &middot; Siswa Berangkat Pagi</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="stylesheet" href="../assets/css/portal.css">
  <style>
    :root{--primary:#0f766e;--primary-dark:#115e59;--accent:#f59e0b;--bg:#f0fdfa;--card:#fff;--text:#173b3a;--muted:#64807e;--line:#d8ebe8;--danger:#dc2626;--radius:18px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#ecfeff,var(--bg));color:var(--text);min-height:100vh;padding-bottom:40px}
    .max-w{max-width:360px;margin:auto;padding:20px}
    .qr-code{background:#fff;border:2px solid var(--primary);border-radius:var(--radius);padding:32px;text-align:center;margin:20px auto;max-width:320px;box-shadow:0 6px 20px rgba(15,118,110,.06)}
    .qr-icon{font-size:4rem;color:var(--primary);margin-bottom:12px}
    .qr-text{font-size:1.1rem;color:var(--primary-dark);font-weight:700;margin-bottom:4px}
    .qr-sub{color:var(--muted);font-size:.85rem}
    .card{background:var(--card);border:1px solid rgba(216,235,232,.8);border-radius:var(--radius);padding:24px;box-shadow:0 8px 24px rgba(15,118,110,.07);margin:20px 0}
    h2{font-size:1.2rem;color:var(--primary-dark);margin-bottom:16px;text-align:center}
    .icon-large{font-size:3rem;margin-bottom:8px;display:block}
    .btn-primary{background:var(--primary);color:#fff;border:0;border-radius:12px;padding:14px 20px;font:700 .85rem inherit;cursor:pointer;width:100%;transition:.18s}
    .btn-primary:hover{background:var(--primary-dark)}
    .notice{padding:12px 14px;border-radius:12px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:.83rem;margin:12px 0}
    .small{font-size:.78rem;color:var(--muted)}
    .link-btn{display:inline-block;margin-top:10px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;font-size:.82rem;color:var(--primary-dark);text-decoration:none;transition:.18s}
    .link-btn:hover{background:#effcf9;border-color:var(--primary)}
  </style>
</head>
<body>

<div class="max-w">

  <div class="card">
    <div style="font-size:3rem;color:var(--primary);margin-bottom:12px;">&#10003;</div>
    <h2>Check-in Berhasil</h2>
    <div style="font-size:1.1rem;color:var(--primary-dark);text-align:center;margin-bottom:24px;">Selamat, <strong id="studentName"></strong>!</div>

    <div class="notice">Absensi berhasil dicatat di server.</div>

    <div style="margin-top:24px;">
      <button class="btn-primary" id="btnNewCheckin">&#10148; Check-in Siswa Lain</button>
    </div>

    <div class="small-footer">Timestamp server: <span id="serverTimestamp">-</span></div>
  </div>

</div>

<script type="module">
  import SBPag from './assets/js/supabase-client.js';

  document.addEventListener('DOMContentLoaded', async function () {
    // Ambil data check-in terakhir dari session storage atau local storage sementara
    var stored = sessionStorage.getItem('lastCheckinStudent');
    var storedTs = sessionStorage.getItem('lastCheckinTimestamp');

    var nameEl = $('#studentName');
    var tsEl = $('#serverTimestamp');

    if (stored && storedTs) {
      try {
        var s = JSON.parse(stored);
        nameEl.textContent = s.nama;
        tsEl.textContent = storedTs;
      } catch (e) {}
    } else {
      // Coba ambil dari check-in terakhir hari ini
      var checkIns = await SBPag.getTodayCheckIns();
      if (checkIns && checkIns.length > 0) {
        // Ambil yang paling awal (siswa paling pagi)
        checkIns.sort(function (a, b) { return new a.checked_in_at - new b.checked_in_at; });
        var first = checkIns[0];
        var s = first.students;
        nameEl.textContent = s ? s.nama : 'Siswa';
        tsEl.textContent = new Date(first.checked_in_at).toLocaleString('id-ID');
      } else {
        nameEl.textContent = 'Siswa';
        tsEl.textContent = '-';
      }
    }

    // Reset session storage
    $('#btnNewCheckin').addEventListener('click', function () {
      sessionStorage.removeItem('lastCheckinStudent');
      sessionStorage.removeItem('lastCheckinTimestamp');
      window.location.href = './index.html';
    });
  });
</script>

</body>
</html>
