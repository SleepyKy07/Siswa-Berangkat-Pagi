<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Absensi Berangkat Pagi</title>
  <meta name="theme-color" content="#0f766e">
  <style>
    :root{--primary:#0f766e;--primary-dark:#115e59;--bg:#f0fdfa;--text:#173b3a;--muted:#64807e;--line:#d8ebe8;--danger:#dc2626}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#ecfeff,var(--bg));color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}

    /* Loading */
    .loading-spinner{width:42px;height:42px;border:4px solid #d8ebe8;border-top-color:var(--primary);border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 16px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{color:var(--muted);font-size:.9rem;font-weight:600}

    /* Layar NONAKTIF — tulisan besar, tanpa tombol/kartu */
    .screen{width:100%;max-width:420px}
    .big-icon{font-size:4.5rem;line-height:1;margin-bottom:18px}
    .big-title{font-size:2.1rem;font-weight:800;letter-spacing:-.5px;line-height:1.15;color:var(--danger);margin-bottom:14px}
    .big-sub{font-size:1.02rem;color:var(--text);line-height:1.6;margin-bottom:22px}

    /* Pesan custom dari admin */
    .custom-reason{
      background:#fff;border:2px solid #fca5a5;border-left:6px solid var(--danger);
      border-radius:14px;padding:16px 18px;margin:0 auto 20px;max-width:420px;
      box-shadow:0 4px 16px rgba(220,38,38,.08);text-align:left;
    }
    .custom-reason p{font-size:.95rem;line-height:1.65;color:#7f1d1d;white-space:pre-wrap;word-break:break-word;margin:0}
    .custom-reason .lbl{
      font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;
      color:var(--danger);font-weight:800;margin-bottom:6px;display:block;
    }
    .divider{height:1px;background:var(--line);max-width:180px;margin:0 auto 18px}
    .schedule-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:6px}
    .schedule-value{font-size:1.5rem;font-weight:800;color:var(--primary-dark);font-variant-numeric:tabular-nums}
    .schedule-note{font-size:.78rem;color:var(--muted);margin-top:8px;line-height:1.5}

    /* Error */
    .err-title{font-size:1.4rem;font-weight:800;color:#92400e;margin-bottom:10px}
    .err-msg{font-size:.9rem;color:var(--muted);line-height:1.6;margin-bottom:18px}
    .btn{border:0;border-radius:12px;padding:13px 22px;min-height:46px;font:700 .85rem inherit;cursor:pointer;background:var(--primary);color:#fff;width:100%;max-width:220px}
    .btn:hover{background:var(--primary-dark)}

    @media (max-width:380px){
      .big-title{font-size:1.75rem}
      .big-icon{font-size:3.6rem}
      .schedule-value{font-size:1.3rem}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js?v=14"></script>
  <script src="../assets/js/supabase-client.js?v=14"></script>
  <script src="../assets/js/checkin.js?v=14"></script>
</head>
<body>

<!-- Loading -->
<div id="loading" class="screen">
  <div class="loading-spinner"></div>
  <p class="loading-text">Memeriksa status absensi&hellip;</p>
</div>

<!-- NONAKTIF: tulisan besar, tanpa tombol -->
<div id="inactiveScreen" class="screen" style="display:none;">
  <div class="big-icon">&#9940;</div>
  <h1 class="big-title">ABSENSI<br>TIDAK AKTIF</h1>

  <!-- Pesan custom dari admin (bila diisi) -->
  <div id="customReason" class="custom-reason" style="display:none;">
    <span class="lbl">Keterangan</span>
    <p id="customReasonText"></p>
  </div>

  <p class="big-sub" id="defaultSub">Sesi absensi Berangkat Pagi sedang ditutup.</p>

  <div id="scheduleWrap" style="display:none;">
    <div class="divider"></div>
    <div class="schedule-label">Jadwal Absensi</div>
    <div class="schedule-value" id="scheduleValue">-</div>
    <p class="schedule-note" id="scheduleNote"></p>
  </div>
</div>

<!-- Error: tetap ada pesan + tombol coba lagi (hindari layar putih) -->
<div id="errorBox" class="screen" style="display:none;">
  <div class="big-icon">&#9888;</div>
  <h1 class="err-title">Gagal Memeriksa Status</h1>
  <p class="err-msg" id="errorMessage"></p>
  <button class="btn" id="btnRetry">&#8637; Coba Lagi</button>
</div>

</body>
</html>
