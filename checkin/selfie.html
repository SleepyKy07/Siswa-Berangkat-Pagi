<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ambil Selfie &middot; Check-in</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="stylesheet" href="../assets/css/portal.css">
  <style>
    :root{--primary:#0f766e;--primary-dark:#115e59;--accent:#f59e0b;--bg:#f0fdfa;--card:#fff;--text:#173b3a;--muted:#64807e;--line:#d8ebe8;--danger:#dc2626;--radius:18px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#ecfeff,var(--bg));color:var(--text);min-height:100vh;padding-bottom:40px}
    .back-bar{background:var(--primary-dark);color:#fff;padding:11px 16px}
    .back-bar a{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600}
    .max-w{max-width:400px;margin:auto;padding:16px}
    .card{background:var(--card);border:1px solid rgba(216,235,232,.8);border-radius:var(--radius);padding:22px;box-shadow:0 8px 24px rgba(15,118,110,.07);margin-bottom:16px}
    h2{font-size:1.1rem;color:var(--primary-dark);margin-bottom:6px}
    .sub{font-size:.82rem;color:var(--muted);margin-bottom:12px}
    .who{background:#f0fdfa;border:1px solid #c9eeea;border-radius:12px;padding:10px 14px;font-size:.82rem;color:var(--primary-dark);margin-bottom:14px}
    .who b{color:var(--primary-dark)}
    .video-wrap{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;margin-bottom:12px}
    video{width:100%;height:100%;object-fit:cover}
    canvas{display:none}
    .btn{border:0;border-radius:11px;padding:12px 16px;min-height:42px;font:700 .82rem inherit;cursor:pointer;transition:.18s;width:100%;background:var(--primary);color:#fff}
    .btn:hover{background:var(--primary-dark)}
    .btn.soft{background:#e6f6f3;color:var(--primary-dark)}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .btn-row{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
    .btn-row .btn{flex:1}
    .notice{padding:12px 14px;border-radius:12px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:.82rem}
    .hidden{display:none}
    .preview{position:relative;border-radius:12px;overflow:hidden;background:#f0fdfa;border:1px solid var(--line);margin-top:12px}
    .preview img{width:100%;display:block}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js?v=11"></script>
  <script src="../assets/js/supabase-client.js?v=11"></script>
</head>
<body>

<header class="back-bar"><a href="./login.html"><span>&#8592;</span> Ganti Nama</a></header>

<div class="max-w">
  <div class="card">
    <h2>&#128247; Selfie Check-in</h2>
    <p class="sub">Ambil foto wajah sebagai bukti kehadiran di gerbang.</p>
    <div class="who" id="whoBox">Memuat identitas&#8230;</div>

    <div class="video-wrap" id="videoWrap">
      <video id="video" playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>

    <div class="notice" id="permissionNotice" style="display:none;"></div>

    <div class="btn-row hidden" id="retryRow">
      <button type="button" class="btn" id="btnRetryCamera">&#8637; Coba Lagi</button>
    </div>

    <div class="btn-row hidden" id="controlsHidden">
      <button type="button" class="btn" id="btnCapture">&#128248; Ambil Foto</button>
    </div>

    <div class="btn-row hidden" id="controlsPreview">
      <button type="button" class="btn soft" id="btnRetake">&#8637; Foto Ulang</button>
      <button type="button" class="btn" id="btnUse">Gunakan Foto</button>
    </div>

    <div class="preview hidden" id="previewBox">
      <img id="previewImg" alt="Preview selfie">
    </div>
  </div>
</div>

<script>
'use strict';
(function () {
  function $(s) { return document.querySelector(s); }

  var video = $('#video');
  var canvas = $('#canvas');
  var ctx = canvas.getContext('2d');
  var stream = null;
  var studentData = null;

  document.addEventListener('DOMContentLoaded', function () {
    if (!window.SBPag) {
      alert('Klien backend tidak tersedia. Cek assets/js/supabase-client.js');
      return;
    }
    window.SBPag.init();

    // Validasi identitas siswa (nama & kelas dari halaman sebelumnya)
    var stored = sessionStorage.getItem('sbCheckinStudent');
    if (!stored) {
      window.location.href = './login.html';
      return;
    }
    try {
      studentData = JSON.parse(stored);
    } catch (e) {
      window.location.href = './login.html';
      return;
    }
    if (!studentData || !studentData.nama || !studentData.kelas) {
      window.location.href = './login.html';
      return;
    }

    // Tampilkan identitas (nama + kelas)
    $('#whoBox').innerHTML = 'Nama: <b>' + escapeHtml(studentData.nama) + '</b> &middot; Kelas: <b>' + escapeHtml(studentData.kelas) + '</b>';

    startCamera();

    $('#btnCapture').addEventListener('click', capturePhoto);
    $('#btnRetake').addEventListener('click', retakePhoto);
    $('#btnUse').addEventListener('click', submitCheckIn);
    $('#btnRetryCamera').addEventListener('click', function () {
      resetCameraUI();
      startCamera();
    });
  });

  function escapeHtml(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Tampilkan pesan spesifik + panduan sesuai penyebab
  function showCameraError(title, detail) {
    $('#videoWrap').style.display = 'none';
    $('#controlsHidden').classList.add('hidden');
    $('#permissionNotice').style.display = 'block';
    $('#permissionNotice').innerHTML =
      '<strong>' + title + '</strong><br>' + detail;
    var r = $('#retryRow');
    if (r) r.classList.remove('hidden');
  }

  function resetCameraUI() {
    $('#permissionNotice').style.display = 'none';
    $('#videoWrap').style.display = 'block';
    $('#retryRow').classList.add('hidden');
    $('#previewBox').classList.add('hidden');
    $('#controlsPreview').classList.add('hidden');
    video.style.display = 'block';
  }

  function startCamera() {
    // 1. Secure context: getUserMedia hanya jalan di https:// atau localhost
    var secure = window.isSecureContext;
    if (!secure) {
      showCameraError(
        'Kamera diblokir: koneksi tidak aman (bukan HTTPS)',
        'Browser hanya mengizinkan kamera lewat <b>https://</b> atau <b>localhost</b>. ' +
        'Saat ini halaman dibuka lewat <code>' + location.origin + '</code>. ' +
        'Buka lewat URL <b>https</b> (versi GitHub Pages) atau <b>http://localhost:8080</b> di laptop.'
      );
      return;
    }

    // 2. Browser mendukung mediaDevices?
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showCameraError(
        'Browser tidak mendukung kamera',
        'Gunakan Chrome, Edge, atau Safari terbaru.'
      );
      return;
    }

    var constraints = {
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    };

    navigator.mediaDevices.getUserMedia(constraints)
      .then(function (s) {
        stream = s;
        video.srcObject = s;
        var p = video.play();
        if (p && p.catch) p.catch(function () { /* autoplay bisa ditolak, abaikan */ });
        $('#controlsHidden').classList.remove('hidden');
        $('#permissionNotice').style.display = 'none';
      })
      .catch(function (err) {
        console.error('[SELFIE] Camera error:', err);
        var name = (err && err.name) || '';
        var msg = (err && err.message) || '';

        if (name === 'NotAllowedError' || name === 'SecurityError') {
          showCameraError(
            'Izin kamera ditolak',
            'Kamu menolak akses kamera. Cara mengizinkan: klik ikon <b>gembok/kamera</b> di ' +
            'address bar browser &rarr; izinkan <b>Kamera</b> &rarr; muat ulang halaman. ' +
            'Atau buka <b>Pengaturan situs &rarr; Kamera &rarr; Izinkan</b>.'
          );
        } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
          showCameraError(
            'Kamera tidak ditemukan',
            'Perangkat ini tidak punya kamera. Gunakan HP dengan kamera untuk selfie.'
          );
        } else if (name === 'NotReadableError' || name === 'TrackStartError') {
          showCameraError(
            'Kamera sedang dipakai aplikasi lain',
            'Tutup aplikasi lain yang memakai kamera (mis. aplikasi Kamera, Zoom, WhatsApp), ' +
            'lalu klik Coba Lagi.'
          );
        } else if (name === 'OverconstrainedError') {
          // Coba ulang tanpa syarat khusus
          navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(function (s) {
              stream = s;
              video.srcObject = s;
              video.play();
              $('#controlsHidden').classList.remove('hidden');
              $('#permissionNotice').style.display = 'none';
            })
            .catch(function () {
              showCameraError('Kamera gagal dibuka', 'Coba muat ulang halaman.');
            });
        } else {
          showCameraError(
            'Kamera gagal dibuka',
            'Penyebab: <code>' + (name || 'tidak diketahui') + '</code> ' +
            (msg ? '(' + msg + ')' : '') + '. Coba muat ulang halaman.'
          );
        }
      });
  }

  function capturePhoto() {
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    // Stop video stream
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
    video.style.display = 'none';
    $('#controlsHidden').classList.add('hidden');

    // Show preview
    var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    $('#previewImg').src = dataUrl;
    $('#previewBox').classList.remove('hidden');
    $('#controlsPreview').classList.remove('hidden');
  }

  function retakePhoto() {
    $('#previewBox').classList.add('hidden');
    $('#controlsPreview').classList.add('hidden');
    video.style.display = 'block';
    startCamera();
  }

  async function submitCheckIn() {
    var btn = $('#btnUse');
    btn.disabled = true;
    btn.textContent = 'MengirimÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã¢â‚¬Å¡Ãƒâ€šÃ‚Â¦';

    try {
      var selfieDataUrl = $('#previewImg').src;

      // Kirim nama & kelas yang diisi siswa. Server memvalidasi & menyimpan.
      var result = await window.SBPag.submitCheckInManual(studentData.nama, studentData.kelas, selfieDataUrl);

      if (result.error) {
        // Pesan yang lebih ramah untuk kondisi umum
        var msg = result.detail || result.error;
        if (result.error === 'SUDAH_CHECKIN_HARI_INI') {
          msg = 'Anda sudah melakukan absensi hari ini.';
        } else if (result.error === 'ABSENSI_TIDAK_AKTIF') {
          msg = 'Sesi absensi sedang tidak aktif. Silakan cek kembali sesuai jadwal.';
        } else if (result.error === 'NAMA_TIDAK_VALID') {
          msg = 'Nama tidak valid. Silakan isi ulang data siswa.';
        } else if (result.error === 'KELAS_TIDAK_VALID') {
          msg = 'Kelas tidak valid. Silakan isi ulang data siswa.';
        }
        alert('Gagal check-in: ' + msg);
        btn.disabled = false;
        btn.textContent = 'Gunakan Foto';
        return;
      }

      // Sukses ÃƒÆ’Ã†â€™Ãƒâ€šÃ‚Â¢ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â€šÂ¬Ã…Â¡Ãƒâ€šÃ‚Â¬ÃƒÆ’Ã‚Â¢ÃƒÂ¢Ã¢â‚¬Å¡Ã‚Â¬Ãƒâ€šÃ‚Â simpan untuk halaman sukses, bersihkan state sementara
      try {
        sessionStorage.setItem('lastCheckinStudent', JSON.stringify(result.student));
        sessionStorage.setItem('lastCheckinTimestamp', result.timestamp);
      } catch (e) { /* ignore */ }
      sessionStorage.removeItem('sbCheckinStudent');

      window.location.href = './success.html';
    } catch (err) {
      console.error('[SELFIE] Submit error:', err);
      alert('Terjadi kesalahan: ' + err.message);
      btn.disabled = false;
      btn.textContent = 'Gunakan Foto';
    }
  }
})();
</script>
</body>
</html>
