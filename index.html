<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Portal Program Kerja OSIS</title>
<link rel="stylesheet" href="./assets/css/portal.css">
</head>
<body>

<header class="portal-head">
  <img class="head-logo left" src="./assets/images/logo-osis.png" alt="Logo OSIS">
  <img class="head-logo right" src="./assets/images/logo-sekolah.png" alt="Logo Sekolah">
  <div class="logo-frame"><img class="logo-osis" src="./assets/images/logo-osis.png" alt="Logo OSIS"></div>
  <h1>Program Kerja OSIS</h1>
  <p class="tagline">Pusat informasi &amp; pengelolaan program kerja OSIS. Pilih program untuk membuka halamannya.</p>
  <span class="badge-osis">&#9993; OSIS &middot; Siswa Sekolah</span>
</header>

<main class="wrap">

  <section class="stats">
    <div class="stat"><b id="jml-proker">0</b><span>Program Aktif</span></div>
    <div class="stat"><b id="jml-siswa">0</b><span>Siswa Terdata</span></div>
    <div class="stat"><b id="jml-apresiasi">0</b><span>Apresiasi Diberikan</span></div>
  </section>

  <section>
    <div class="sec-title"><h2>Daftar Program Kerja</h2></div>
    <div class="grid-proker" id="grid-proker">
      <div class="dashed">Memuat daftar program&#8230;</div>
    </div>
  </section>

</main>

<footer>
  &copy; Organisasi Siswa Intra Sekolah &middot; Portal Program Kerja OSIS
</footer>

<script src="./assets/js/portal.js"></script>
</body>
</html>
